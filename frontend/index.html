<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Lead Qualifier</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f4f4f5; }
    body { margin: 0; max-width: 1100px; margin-inline: auto; padding: 1rem 1.25rem 2rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p.sub { margin: 0 0 1rem; color: #52525b; font-size: 0.9rem; }
    nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    nav button {
      border: 1px solid #d4d4d8; background: #fff; padding: 0.45rem 0.9rem;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    nav button.active { background: #18181b; color: #fff; border-color: #18181b; }
    section.panel {
      display: none; background: #fff; border: 1px solid #e4e4e7;
      border-radius: 8px; padding: 1rem 1.1rem;
    }
    section.panel.visible { display: block; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    input[type="file"] { font-size: 0.85rem; }
    button.primary {
      background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .err { color: #b91c1c; font-size: 0.85rem; white-space: pre-wrap; }
    .ok { color: #15803d; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 0.5rem; }
    th, td { border: 1px solid #e4e4e7; padding: 0.35rem 0.45rem; vertical-align: top; text-align: left; }
    th { background: #fafafa; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    details { margin-top: 0.25rem; }
    #chat-log {
      border: 1px solid #e4e4e7; border-radius: 6px; height: 280px; overflow-y: auto;
      padding: 0.5rem 0.65rem; background: #fafafa; font-size: 0.88rem; margin-bottom: 0.5rem;
    }
    .bubble { margin: 0.35rem 0; padding: 0.35rem 0.5rem; border-radius: 6px; max-width: 95%; }
    .bubble.user { background: #dbeafe; margin-left: 1.5rem; }
    .bubble.assistant { background: #fff; border: 1px solid #e4e4e7; margin-right: 1.5rem; }
    .bubble .meta { font-size: 0.72rem; color: #71717a; margin-bottom: 0.15rem; }
    #chat-input {
      width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 6px;
      border: 1px solid #d4d4d8; font-size: 0.9rem; margin-bottom: 0.35rem;
    }
    textarea { width: 100%; box-sizing: border-box; min-height: 4rem; font-size: 0.82rem; }
    .btn-sm { font-size: 0.78rem; padding: 0.25rem 0.45rem; margin: 0.15rem 0.2rem 0 0; cursor: pointer; border-radius: 4px; border: 1px solid #d4d4d8; background: #fff; }
    .btn-sm.primary-sm { background: #2563eb; color: #fff; border-color: #2563eb; }
    tr.final-row.hidden { display: none; }
    .final-row td { background: #fafafa; }
    #leads-export-row a { font-size: 0.85rem; margin-right: 0.75rem; }
    .email-body-preview {
      cursor: pointer;
      border: 1px dashed #d4d4d8;
      border-radius: 4px;
      padding: 0.35rem;
      margin: 0.25rem 0 0;
      background: #fff;
      white-space: pre-wrap;
    }
    .email-body-preview:hover { border-color: #2563eb; background: #eff6ff; }
    .body-summary-edit { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Smart Lead Qualifier &amp; Outreach</h1>
  <p class="sub">Upload a CSV (Leads) or use the Assistant (Chat). API: <code>/api/v1</code></p>

  <nav>
    <button type="button" class="tab active" data-tab="leads">Leads</button>
    <button type="button" class="tab" data-tab="chat">Assistant</button>
    <button type="button" class="tab" data-tab="icp">ICP</button>
  </nav>

  <section id="panel-leads" class="panel visible">
    <div class="row">
      <input type="file" id="csv-file" accept=".csv,text/csv" />
      <button type="button" class="primary" id="btn-process">Run pipeline</button>
      <div class="row" id="leads-export-row" style="display: none;">
        <span style="font-size:0.85rem;color:#52525b;">Export last run (server):</span>
        <a href="#" id="link-export-csv">Download CSV</a>
        <a href="#" id="link-export-json">Download JSON</a>
      </div>
    </div>
    <div id="leads-status" class="err"></div>
    <div id="leads-errors" class="err"></div>
    <div id="leads-progress-bar" aria-live="polite"></div>
    <div id="leads-table-wrap"></div>
  </section>

  <section id="panel-chat" class="panel">
    <p class="sub" style="margin-top:0">Session is kept in <code>localStorage</code> for this browser.</p>
    <label style="font-size:0.85rem;display:flex;gap:0.35rem;align-items:center;margin:0 0 0.5rem;">
      <input type="checkbox" id="use-pipeline-ctx" checked />
      Include last lead run in assistant context (server memory)
    </label>
    <div id="chat-log"></div>
    <textarea id="chat-input" placeholder="Message the assistant…"></textarea>
    <div class="row">
      <button type="button" class="primary" id="btn-send">Send</button>
      <button type="button" id="btn-new-session">New session</button>
    </div>
    <div id="chat-status" class="err"></div>
  </section>

  <section id="panel-icp" class="panel">
    <p class="sub" style="margin-top:0">
      Ideal Customer Profile used for <strong>scoring</strong>. In-memory until server restart.
    </p>
    <div class="row">
      <button type="button" class="primary" id="btn-icp-load">Load current</button>
      <button type="button" class="primary" id="btn-icp-save">Save</button>
      <button type="button" id="btn-icp-reset">Reset to default</button>
    </div>
    <label style="font-size:0.85rem;">Target industries (comma-separated)</label>
    <textarea id="icp-industries" placeholder="Software, SaaS, …"></textarea>
    <label style="font-size:0.85rem;">Keywords (comma-separated)</label>
    <textarea id="icp-keywords" placeholder="cloud, API, …"></textarea>
    <label style="font-size:0.85rem;">Notes</label>
    <textarea id="icp-notes" placeholder="Who you sell to…"></textarea>
    <div id="icp-status" class="err"></div>
  </section>

  <script>
    const API = "/api/v1";
    const LS_KEY = "smartlead_chat_session_id";

    function tabSwitch(name) {
      document.querySelectorAll(".tab").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === name);
      });
      document.getElementById("panel-leads").classList.toggle("visible", name === "leads");
      document.getElementById("panel-chat").classList.toggle("visible", name === "chat");
      document.getElementById("panel-icp").classList.toggle("visible", name === "icp");
    }

    document.querySelectorAll(".tab").forEach((b) => {
      b.addEventListener("click", () => tabSwitch(b.dataset.tab));
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const leadsStatus = document.getElementById("leads-status");
    const leadsErrors = document.getElementById("leads-errors");
    const leadsWrap = document.getElementById("leads-table-wrap");
    const progressBar = document.getElementById("leads-progress-bar");

    let lastLeadRows = [];
    let openFinalEditorIndex = null;

    document.getElementById("link-export-csv").addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = API + "/leads/export-csv";
    });
    document.getElementById("link-export-json").addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = API + "/leads/export-json";
    });

    function effectiveOutreach(r) {
      if (r && r.final_outreach && (r.final_outreach.subject || r.final_outreach.body)) {
        return r.final_outreach;
      }
      return (r && r.outreach) || {};
    }

    function parseSseBuffer(buffer, onEvent) {
      const parts = buffer.split("\n\n");
      const rest = parts.pop() || "";
      for (const block of parts) {
        const line = block.trim().split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        const json = line.replace(/^data:\s*/, "");
        try {
          onEvent(JSON.parse(json));
        } catch {}
      }
      return rest;
    }

    async function renderLeadsTable() {
      const rows = lastLeadRows;
      if (!rows.length) {
        leadsWrap.innerHTML = "";
        return;
      }

      const htmlRows = rows.map((r, i) => {
        const L = r.lead || {};
        const R = r.research || {};
        const S = r.score || {};
        const F = effectiveOutreach(r);
        const isFinal = !!(r.final_outreach && (r.final_outreach.subject || r.final_outreach.body));

        return `
            <tr data-lead-index="${i}">
              <td>${escapeHtml(L.company_name || "")}</td>
              <td>${escapeHtml(L.website || "")}</td>
              <td>${escapeHtml(R.industry || "")}</td>
              <td class="num">${escapeHtml(String(S.score ?? ""))}</td>
              <td>${escapeHtml(F.subject || "")}${isFinal ? ' <span style="color:#15803d;font-size:0.7rem;">(final)</span>' : ""}</td>
              <td>
                <details>
                  <summary class="body-summary-edit" data-lead-index="${i}">
                    Email body (${isFinal ? "final" : "auto"}) — open, then click body to edit
                  </summary>
                  <pre class="email-body-preview" data-lead-index="${i}" title="Click to edit draft">${escapeHtml(F.body || "")}</pre>
                </details>
                <details><summary>Research</summary>
                  <pre style="white-space:pre-wrap;margin:0.25rem 0 0">${escapeHtml(JSON.stringify(R, null, 2))}</pre>
                </details>
                <details><summary>Score detail</summary>
                  <pre style="white-space:pre-wrap;margin:0.25rem 0 0">${escapeHtml(S.rationale || "")}</pre>
                </details>
                <div class="row" style="margin-top:0.35rem;">
                  <button type="button" class="btn-sm copy-outreach-btn" data-lead-index="${i}">Copy email</button>
                  <button type="button" class="btn-sm regen-btn" data-lead-index="${i}">Regenerate</button>
                  <button type="button" class="btn-sm open-final-editor-btn" data-lead-index="${i}">Edit final draft</button>
                </div>
              </td>
              <td class="send-cell">
                <button type="button"
                  class="send-outreach-btn primary-sm btn-sm"
                  data-lead-index="${i}"
                  ${!(L.contact_email || "").trim() ? 'title="No email in CSV — you will be prompted"' : ""}>
                  Send email
                </button>
                <span class="send-outreach-status" data-lead-index="${i}" style="font-size:0.75rem;margin-left:0.35rem;"></span>
              </td>
            </tr>
            <tr class="final-row ${openFinalEditorIndex === i ? "" : "hidden"}" data-lead-index="${i}">
              <td colspan="7">
                <div style="font-size:0.78rem;color:#52525b;margin-bottom:0.25rem;">
                  <strong>Edit final draft</strong> (saved to server on Save)
                </div>
                <label style="font-size:0.75rem;">Subject</label>
                <input class="final-subj" data-lead-index="${i}" style="width:100%;box-sizing:border-box;margin-bottom:0.25rem;" value="${escapeHtml(F.subject || "")}" />
                <label style="font-size:0.75rem;">Body</label>
                <textarea class="final-body" data-lead-index="${i}" rows="5" style="width:100%;box-sizing:border-box;">${escapeHtml(F.body || "")}</textarea>
                <button type="button" class="btn-sm primary-sm save-final-btn" data-lead-index="${i}">Save final draft</button>
                <button type="button" class="btn-sm cancel-final-btn" data-lead-index="${i}">Cancel</button>
                <span class="save-final-status" data-lead-index="${i}" style="font-size:0.75rem;margin-left:0.35rem;"></span>
              </td>
            </tr>`;
      }).join("");

      leadsWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Website</th>
              <th>Industry</th>
              <th>Score</th>
              <th>Subject</th>
              <th>Details &amp; actions</th>
              <th>Send</th>
            </tr>
          </thead>
          <tbody>${htmlRows}</tbody>
        </table>`;

      async function openFinalEditorForIndex(i) {
        openFinalEditorIndex = i;
        await renderLeadsTable();
        requestAnimationFrame(() => {
          const ed = leadsWrap.querySelector(`tr.final-row[data-lead-index="${i}"]`);
          if (ed) ed.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }

      leadsWrap.querySelectorAll(".email-body-preview").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          const i = parseInt(el.getAttribute("data-lead-index"), 10);
          openFinalEditorForIndex(i);
        });
      });

      leadsWrap.querySelectorAll(".body-summary-edit").forEach((el) => {
        el.addEventListener("click", () => {
          const i = parseInt(el.getAttribute("data-lead-index"), 10);
          setTimeout(() => openFinalEditorForIndex(i), 0);
        });
      });

      leadsWrap.querySelectorAll(".open-final-editor-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-lead-index"), 10);
          openFinalEditorForIndex(i);
        });
      });

      leadsWrap.querySelectorAll(".cancel-final-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          openFinalEditorIndex = null;
          renderLeadsTable();
        });
      });

      leadsWrap.querySelectorAll(".copy-outreach-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.getAttribute("data-lead-index"), 10);
          const r = lastLeadRows[i];
          const e = effectiveOutreach(r);
          const text = "Subject: " + (e.subject || "") + "\n\n" + (e.body || "");
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = "Copy email"; }, 1500);
          } catch {
            alert(text);
          }
        });
      });

      leadsWrap.querySelectorAll(".regen-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.getAttribute("data-lead-index"), 10);
          btn.disabled = true;
          try {
            const res = await fetch(API + "/leads/" + i + "/regenerate", { method: "POST" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              throw new Error(
                typeof data.detail === "string"
                  ? data.detail
                  : JSON.stringify(data.detail || data),
              );
            }
            lastLeadRows[i] = data;
            openFinalEditorIndex = null;
            await renderLeadsTable();
          } catch (e) {
            alert(String(e));
          } finally {
            btn.disabled = false;
          }
        });
      });

      leadsWrap.querySelectorAll(".save-final-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.getAttribute("data-lead-index"), 10);
          const tr = leadsWrap.querySelector(`tr.final-row[data-lead-index="${i}"]`);
          if (!tr) return;
          const subj = tr.querySelector(".final-subj").value;
          const body = tr.querySelector(".final-body").value;
          const st = leadsWrap.querySelector(`.save-final-status[data-lead-index="${i}"]`);
          btn.disabled = true;
          if (st) st.textContent = "";
          try {
            const res = await fetch(API + "/leads/" + i + "/final-outreach", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ subject: subj, body: body }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              throw new Error(
                typeof data.detail === "string"
                  ? data.detail
                  : JSON.stringify(data.detail || data),
              );
            }
            lastLeadRows[i] = data;
            openFinalEditorIndex = null;
            if (st) st.textContent = "Saved.";
            await renderLeadsTable();
          } catch (e) {
            if (st) st.textContent = "Error";
            alert(String(e));
          } finally {
            btn.disabled = false;
          }
        });
      });

      let mailConfigured = false;
      try {
        const st = await fetch(API + "/leads/outreach-mail-status").then((r) => r.json());
        mailConfigured = !!st.configured;
      } catch {}

      leadsWrap.querySelectorAll(".send-outreach-btn").forEach((btn) => {
        if (!mailConfigured) {
          btn.disabled = true;
          btn.title = "Set SENDER_EMAIL and GMAIL_SMTP_KEY on the server.";
          return;
        }

        btn.addEventListener("click", async () => {
          const idx = parseInt(btn.getAttribute("data-lead-index"), 10);
          const statusEl = leadsWrap.querySelector(
            `.send-outreach-status[data-lead-index="${idx}"]`,
          );
          const row = lastLeadRows[idx];
          const ce = (row.lead && row.lead.contact_email) || "";

          let toEmail = null;
          if (!ce.trim()) {
            toEmail = window.prompt("Recipient email (not in CSV):");
            if (!toEmail || !toEmail.trim()) {
              if (statusEl) statusEl.textContent = "Cancelled.";
              return;
            }
          }

          btn.disabled = true;
          if (statusEl) statusEl.textContent = "Sending…";

          try {
            const payload = { lead_index: idx };
            if (toEmail) payload.to_email = toEmail.trim();

            const res = await fetch(API + "/leads/send-outreach-email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              throw new Error(
                typeof data.detail === "string"
                  ? data.detail
                  : JSON.stringify(data.detail || data),
              );
            }

            if (statusEl) statusEl.textContent = "Sent ✓";
          } catch (e) {
            if (statusEl) statusEl.textContent = "Failed";
            alert(String(e));
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    document.getElementById("btn-process").addEventListener("click", async () => {
      leadsStatus.textContent = "";
      leadsErrors.textContent = "";
      leadsWrap.innerHTML = "";
      progressBar.textContent = "";

      const input = document.getElementById("csv-file");
      if (!input.files || !input.files[0]) {
        leadsStatus.textContent = "Choose a CSV file first.";
        return;
      }

      const fd = new FormData();
      fd.append("file", input.files[0]);

      const btn = document.getElementById("btn-process");
      btn.disabled = true;

      leadsStatus.textContent = "Streaming…";
      progressBar.textContent = "Starting…";

      const rows = [];

      try {
        const res = await fetch(API + "/leads/process-stream", {
          method: "POST",
          body: fd,
        });

        if (!res.ok || !res.body) {
          const text = await res.text();
          throw new Error(text || "Stream failed");
        }

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += dec.decode(value, { stream: true });

          buf = parseSseBuffer(buf, (ev) => {
            if (ev.event === "start") {
              progressBar.textContent = "Processing " + ev.total + " lead(s)…";
            }

            if (ev.event === "step") {
              progressBar.textContent =
                ev.message || ev.phase + " " + ev.index + "/" + ev.total + " " + ev.company;
            }

            if (ev.event === "lead") {
              rows.push(ev.data);
            }

            if (ev.event === "complete") {
              progressBar.textContent = "Done — " + ev.lead_count + " lead(s).";
              if (ev.errors && ev.errors.length) {
                leadsErrors.textContent = "Warnings:\n" + ev.errors.join("\n");
              }
            }
          });
        }

        lastLeadRows = rows;
        openFinalEditorIndex = null;
        document.getElementById("leads-export-row").style.display =
          rows.length ? "flex" : "none";

        await renderLeadsTable();

        leadsStatus.textContent = "Done (" + rows.length + " lead(s)).";
        leadsStatus.className = "ok";
      } catch (e) {
        leadsStatus.textContent = "Stream failed.";
        leadsErrors.textContent = String(e);
        progressBar.textContent = "";
        lastLeadRows = [];
        document.getElementById("leads-export-row").style.display = "none";
      } finally {
        btn.disabled = false;
      }
    });

    const chatLog = document.getElementById("chat-log");
    const chatInput = document.getElementById("chat-input");
    const chatStatus = document.getElementById("chat-status");

    function appendBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "assistant");
      div.innerHTML =
        "<div class=\"meta\">" +
        role +
        "</div><div>" +
        escapeHtml(text).replace(/\n/g, "<br/>") +
        "</div>";
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function ensureSession() {
      let sid = localStorage.getItem(LS_KEY);
      if (sid) return sid;

      const res = await fetch(API + "/chat/sessions", { method: "POST" });
      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data));

      sid = data.session_id;
      localStorage.setItem(LS_KEY, sid);
      return sid;
    }

    document.getElementById("btn-send").addEventListener("click", sendChat);

    async function sendChat() {
      chatStatus.textContent = "";

      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = "";
      appendBubble("user", text);

      const btn = document.getElementById("btn-send");
      btn.disabled = true;

      try {
        const sid = await ensureSession();
        const useCtx = document.getElementById("use-pipeline-ctx").checked;

        const res = await fetch(API + "/chat/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sid,
            message: text,
            use_pipeline_context: useCtx,
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          chatStatus.textContent =
            typeof data.detail === "string"
              ? data.detail
              : JSON.stringify(data.detail || data);
          return;
        }

        appendBubble("assistant", data.reply || "");
      } catch (e) {
        chatStatus.textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("btn-new-session").addEventListener("click", async () => {
      localStorage.removeItem(LS_KEY);
      chatLog.innerHTML = "";
      chatStatus.textContent = "";
      try {
        await ensureSession();
        chatStatus.textContent = "New session ready.";
        chatStatus.className = "ok";
      } catch (e) {
        chatStatus.textContent = String(e);
        chatStatus.className = "err";
      }
    });

    const icpStatus = document.getElementById("icp-status");

    function splitList(s) {
      return s.split(",").map((x) => x.trim()).filter(Boolean);
    }

    async function loadIcp() {
      icpStatus.textContent = "";

      try {
        const res = await fetch(API + "/icp");
        const data = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(data));

        document.getElementById("icp-industries").value =
          (data.target_industries || []).join(", ");

        document.getElementById("icp-keywords").value =
          (data.keywords || []).join(", ");

        document.getElementById("icp-notes").value = data.notes || "";

        icpStatus.textContent = "Loaded.";
        icpStatus.className = "ok";
      } catch (e) {
        icpStatus.textContent = String(e);
        icpStatus.className = "err";
      }
    }

    document.getElementById("btn-icp-load").addEventListener("click", loadIcp);

    document.getElementById("btn-icp-save").addEventListener("click", async () => {
      icpStatus.textContent = "";

      const body = {
        target_industries: splitList(document.getElementById("icp-industries").value),
        keywords: splitList(document.getElementById("icp-keywords").value),
        notes: document.getElementById("icp-notes").value.trim(),
      };

      try {
        const res = await fetch(API + "/icp", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(data));

        icpStatus.textContent = "Saved.";
        icpStatus.className = "ok";
      } catch (e) {
        icpStatus.textContent = String(e);
        icpStatus.className = "err";
      }
    });

    document.getElementById("btn-icp-reset").addEventListener("click", async () => {
      icpStatus.textContent = "";

      try {
        const res = await fetch(API + "/icp/reset", { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(JSON.stringify(data));

        document.getElementById("icp-industries").value =
          (data.target_industries || []).join(", ");

        document.getElementById("icp-keywords").value =
          (data.keywords || []).join(", ");

        document.getElementById("icp-notes").value = data.notes || "";

        icpStatus.textContent = "Reset to defaults.";
        icpStatus.className = "ok";
      } catch (e) {
        icpStatus.textContent = String(e);
        icpStatus.className = "err";
      }
    });

    loadIcp();
  </script>
</body>
</html>
